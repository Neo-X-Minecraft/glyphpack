[package]
name = "glyphpack"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
description = "Dense UTF-16 payload encoding with a specialized Rust/Wasm decoder"
license = "0BSD"
readme = "README.md"
authors = ["NeoX"]
repository = "https://github.com/Neo-X-Minecraft/glyphpack"
homepage = "https://neo-x-minecraft.github.io/glyphpack/"
exclude = ["benchmarks/results/*", "benchmarks/experiments/snapshots/*", "tests/vendor/*", ".github/*"]
keywords = ["encoding", "utf16", "html", "payload", "javascript"]
categories = ["encoding", "command-line-utilities", "web-programming"]

[features]
default = ["tools"]
tools = ["dep:serde_json"]

[dependencies]
serde_json = { version = "=1.0.154", optional = true }

[[bin]]
name = "glyphpack"
path = "src/main.rs"
required-features = ["tools"]

[[example]]
name = "encode_bench"
required-features = ["tools"]

[[test]]
name = "native"
required-features = ["tools"]

[[test]]
name = "cli"
required-features = ["tools"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
members = ["crates/decoder-wasm", "crates/encoder-wasm"]
default-members = ["."]
resolver = "2"

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
panic = "abort"

[[example]]
name = "adapter_prototype"
required-features = ["tools"]

[[example]]
name = "hybrid_prototype"
required-features = ["tools"]

[[example]]
name = "paired_report"
required-features = ["tools"]
