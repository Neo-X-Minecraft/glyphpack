name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
            generated/wasm
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/*.rs', 'crates/**', 'package-lock.json') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-1.99.1-
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist
      # This is compatibility coverage, not the recorded Chromium 156 benchmark.
      - run: npx playwright install --with-deps chromium
      - name: Browser compatibility smoke
        run: |
          browser=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')
          version=$("$browser" --version | sed -E 's/.* ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          CHROMIUM_BIN="$browser" CHROMIUM_VERSION="$version" npm run test:browser
      - name: Archived candidate compatibility smoke
        run: |
          browser=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')
          version=$("$browser" --version | sed -E 's/.* ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          CHROMIUM_BIN="$browser" CHROMIUM_VERSION="$version" target/release/glyphpack bench history --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-candidate-smoke
          path: generated/results/history/
          retention-days: 14
  native:
    name: native (${{ matrix.runner }}, Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust: 1.85.0
          - runner: ubuntu-24.04-arm
            rust: 1.99.1
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --no-default-features --lib
      - name: Native vectors, CLI and reports
        run: cargo test --locked --lib --test native --test cli -- --skip all_63_specialized_wasm_builds --skip invalid_build_choices_and_minimal_code
  modules:
    name: npm package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:types
      - run: npm run test:package
