name: benchmarks
on:
  workflow_dispatch:
    inputs:
      comparison:
        description: Browser coverage (cloud measurements are not the Chromium 156 baseline)
        type: choice
        options: [full, smoke, history, history-smoke, paired]
        default: full
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
            generated/wasm
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/*.rs', 'crates/**', 'package-lock.json') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-1.99.1-
      - run: npm ci
      - run: cargo build --release --locked
      - run: npx playwright install --with-deps chromium
      - name: Decode comparison
        if: inputs.comparison != 'paired'
        env:
          MODE: ${{ inputs.comparison }}
        run: |
          browser=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')
          version=$("$browser" --version | sed -E 's/.* ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          mode=run
          if [ "$MODE" = smoke ]; then mode=smoke; fi
          if [ "$MODE" = history ]; then mode=history; fi
          if [ "$MODE" = history-smoke ]; then
            CHROMIUM_BIN="$browser" CHROMIUM_VERSION="$version" target/release/glyphpack bench history --quick
          else
            CHROMIUM_BIN="$browser" CHROMIUM_VERSION="$version" target/release/glyphpack bench "$mode"
          fi
      - name: Paired release comparison
        if: inputs.comparison == 'paired'
        run: |
          git fetch origin tag v0.2.0 --depth=1
          target/release/glyphpack build --all
          target/release/glyphpack bench prepare
          mkdir -p generated/results
          git show v0.2.0:dist/full.min.mjs > generated/results/baseline-v0.2.0.mjs
          browser=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')
          version=$("$browser" --version | sed -E 's/.* ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          CHROMIUM_BIN="$browser" CHROMIUM_VERSION="$version" COMPARE_DATASETS=all node benchmarks/compare.cjs generated/results/baseline-v0.2.0.mjs dist/full.min.mjs generated/results/paired.json
      - name: Native encoder comparison
        run: cargo run --release --locked --example encode_bench -- --quick --output generated/results/encoder.json > generated/results/encoder.csv
      - name: Summarize full comparison
        if: inputs.comparison == 'full'
        run: |
          target/release/glyphpack summary --input generated/results/encoding-decode-benchmark.csv --output generated/results/report
          cat generated/results/report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks-${{ github.sha }}
          path: generated/results/
          retention-days: 30
